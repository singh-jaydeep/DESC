// Sequential = ONE hue, light->dark (blue). Diverging = two hues + a NEUTRAL GRAY midpoint
// (blue<->red). Never a rainbow. Dark mode takes its own steps from the same ramps, chosen
// against the dark surface rather than flipped automatically, so that in both themes the
// high-magnitude end is the one with contrast.
const DARK = matchMedia("(prefers-color-scheme:dark)").matches;
const SEQ  = DARK ? ["#184f95","#256abf","#3987e5","#6da7ec","#9ec5f4","#cde2fb"]
                  : ["#cde2fb","#9ec5f4","#6da7ec","#3987e5","#256abf","#0d366b"];
const MID  = DARK ? "#383835" : "#f0efec";
const NEG  = DARK ? "#e66767" : "#d03b3b";     // ratio < 1 : L_gradB fell = HARDER
const POS  = DARK ? "#86b6ef" : "#256abf";     // ratio > 1 : L_gradB rose = easier
function hex2rgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function mix(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);
  return `rgb(${Math.round(A[0]+(B[0]-A[0])*t)},${Math.round(A[1]+(B[1]-A[1])*t)},${Math.round(A[2]+(B[2]-A[2])*t)})`;}
function seqCol(t){t=Math.max(0,Math.min(1,t));const x=t*(SEQ.length-1),i=Math.min(SEQ.length-2,Math.floor(x));
  return mix(SEQ[i],SEQ[i+1],x-i);}
function divCol(t){  // t in [-1, 1], 0 = unchanged
  return t<0 ? mix(MID,NEG,Math.min(1,-t)) : mix(MID,POS,Math.min(1,t));}
let fieldMode = "off";
function fieldVal(i,j){
  const F = fieldMode==="abs" ? FIELD.abs : FIELD.ratio;
  return F ? F[i][j] : null;
}
function fieldCol(i,j){
  const v = fieldVal(i,j); if (v===null) return null;
  if (fieldMode==="abs") return seqCol((v-FIELD.abs_lo)/Math.max(1e-9,FIELD.abs_hi-FIELD.abs_lo));
  const span = Math.max(Math.abs(FIELD.ratio_lo-1), Math.abs(FIELD.ratio_hi-1), 1e-9);
  return divCol((v-1)/span);
}

const LBL = {length:"length", kappa:"κ max", kappa_MS:"κ MS", convex:"∫|κ|ds − 2π", d_cc:"d_cc", d_pc:"d_pc"};
const UNIT = {length:"m", kappa:"1/m", kappa_MS:"1/m²", convex:"rad", d_cc:"m", d_pc:"m"};
const LOWER = {d_cc:1, d_pc:1};  // lower bounds: satisfied when value / bound >= 1

let cur = 0, yaw = 0.6, pitch = 0.5, zoom = 1, panx = 0, pany = 0;
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");

function css(v) {
  return getComputedStyle(document.documentElement).getPropertyValue(v).trim();
}
function rot(p) {
  const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
  const x = p[0] * cy - p[1] * sy, y = p[0] * sy + p[1] * cy, z = p[2];
  return [x, y * cp - z * sp, y * sp + z * cp];  // [screen x, depth, screen y]
}
let scale = 1, cx = 0, cyv = 0;
function proj(p) {

}
function extent() {
  let m = 0;
  for (const c of DATA[cur].coils) for (const p of c) m = Math.max(m, Math.abs(p[0]), Math.abs(p[1]), Math.abs(p[2]));
  return m || 1;
}
function resize() {
  const r = cv.parentElement.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  cv.width = r.width * d; cv.height = r.height * d; ctx.setTransform(d, 0, 0, d, 0, 0);
  cx = r.width / 2; cyv = r.height / 2;
  scale = 0.42 * Math.min(r.width, r.height) / extent() * zoom;

}
function seg(list, a, b, color, w) {
  const A = proj(a), B = proj(b);

}
function hue(i, n) { return `hsl(${Math.round(360 * i / n)},68%,50%)`; }

function draw() {
  const d = DATA[cur]; if (!d) return;
  ctx.clearRect(0, 0, cv.width, cv.height);
  const items = [];
  if (document.getElementById("cPlasma").checked && PLASMA.length) {
    const base = css("--line"), nt = PLASMA.length, np = PLASMA[0].length;
    const on = fieldMode !== "off" && fieldVal(0, 0) !== null;
    // When a field is on the wireframe is drawn denser and thicker: it is carrying data now,
    // not just marking where the boundary is.
    const dj = on ? 2 : 4, w = on ? 1.6 : 1;
    for (let i = 0; i < nt; i += 2) for (let j = 0; j < np; j++)
      seg(items, PLASMA[i][j], PLASMA[i][(j + 1) % np], on ? fieldCol(i, j) : base, w);
    for (let j = 0; j < np; j += dj) for (let i = 0; i < nt; i++)
      seg(items, PLASMA[i][j], PLASMA[(i + 1) % nt][j], on ? fieldCol(i, j) : base, w);
  }
  if (STREAM && document.getElementById("cStream").checked) {
    // coloured by each contour's OWN eps_1, so non-planar streamlines are identifiable
    const span = Math.max(1e-9, STREAM.hi - STREAM.lo);
    for (let k = 0; k < STREAM.curves.length; k++) {
      const c = STREAM.curves[k], col = seqCol((STREAM.eps1[k] - STREAM.lo) / span);
      for (let t = 0; t < c.length; t++) seg(items, c[t], c[(t + 1) % c.length], col, 1.3);
    }
  }
  const only = document.getElementById("cUnique").checked;
  const rows = only ? d.unique_rows : d.coils.map((_, k) => k);
  for (const k of rows) {
    const c = d.coils[k], col = hue(k, d.coils.length);
    for (let t = 0; t < c.length; t++) seg(items, c[t], c[(t + 1) % c.length], col, 1.9);
  }
  items.sort((a, b) => b.z - a.z);
  for (const s of items) {
    ctx.strokeStyle = s.c; ctx.lineWidth = s.w; ctx.beginPath();
    ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
  }
  if (document.getElementById("cCurv").checked) {
    ctx.fillStyle = css("--fg");
    for (const p of d.curv_peaks) {
      const q = proj(d.coils[p.row][p.idx]);
      ctx.beginPath(); ctx.arc(q[0], q[1], 3, 0, 7); ctx.fill();
    }
  }
  if (document.getElementById("cClosest").checked) {
    const A = proj(d.closest.a), B = proj(d.closest.b);
    ctx.strokeStyle = "#e53935"; ctx.lineWidth = 2.5; ctx.setLineDash([5, 3]);
    ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.stroke();
    ctx.setLineDash([]); ctx.fillStyle = "#e53935";
    for (const q of [A, B]) { ctx.beginPath(); ctx.arc(q[0], q[1], 3.5, 0, 7); ctx.fill(); }
  }
  if (document.getElementById("cAxes").checked) {
    const L = extent() * 0.55;
    ctx.font = "11px ui-monospace,monospace";
    for (const [a, b, nm] of [[[0, 0, 0], [L, 0, 0], "x"], [[0, 0, 0], [0, L, 0], "y"], [[0, 0, 0], [0, 0, L], "z"]]) {
      const A = proj(a), B = proj(b);
      ctx.strokeStyle = css("--mut"); ctx.lineWidth = 1; ctx.beginPath();
      ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.stroke();
      ctx.fillStyle = css("--mut"); ctx.fillText(nm, B[0] + 3, B[1] + 3);
    }
  }
  document.getElementById("hud").textContent =
    `${d.n_coils} coils${only ? " (" + d.unique_rows.length + " unique shown)" : ""} · ` +
    `closest pair ${d.closest.i + 1}–${d.closest.j + 1} at ${(d.closest.d * 1000).toFixed(1)} mm (sampled)`;
}

function panel() {
  const d = DATA[cur];
  document.getElementById("subtitle").textContent =
    d.file + (d.length_multiplier !== 1 ? ` · length bound ×${d.length_multiplier}` : "");
  const msgs = [];
  if (d.n_coils !== d.expected) msgs.push(`<b>${d.n_coils} coils, expected ${d.expected}.</b> The coilset was read wrongly, or its nesting is not what is assumed.`);
  if (d.linked.length) msgs.push(`<b>${d.linked.length} linked pair${d.linked.length > 1 ? "s" : ""}:</b> ` +
    d.linked.map(p => p[0] + "–" + p[1]).join(", ") + ". This coilset is void.");
  document.getElementById("warnbox").innerHTML = msgs.length ? `<div id="warn">${msgs.join("<br><br>")}</div>` : "";
  const rows = Object.keys(LBL).map(k => {
    const v = d.quantities[k], mg = d.margins[k];
    const good = LOWER[k] ? mg >= 1 : mg <= 1;
    const shown = (k === "d_cc" || k === "d_pc") ? (v * 1000).toFixed(1) + " mm"
      : k === "convex" ? v.toExponential(2) + " " + UNIT[k] : v.toFixed(3) + " " + UNIT[k];
    const cell = mg === null ? `<td class="v">no bound</td>` : `<td class="v ${good ? "ok" : "bad"}">${mg.toFixed(3)}</td>`;
    return `<tr><td class="k">${LBL[k]}</td><td class="v">${shown}</td>${cell}</tr>`;
  }).join("");
  document.getElementById("stats").innerHTML = rows +
    `<tr><td class="k">linked pairs</td><td class="v"></td><td class="v ${d.linked.length ? "bad" : "ok"}">${d.linked.length}</td></tr>` +
    `<tr><td class="k">⟨|B·n|⟩/⟨|B|⟩ ${d.extra.vacuum ? "(vacuum)" : "(coils + plasma)"}</td><td class="v">${d.extra.bn.toExponential(3)}</td><td></td></tr>` +
    `<tr><td class="k">⟨|B·n|/|B|⟩, max |B·n|</td><td class="v">${d.extra.bn_local.toExponential(3)}, ${d.extra.bn_max_T.toFixed(3)} T</td><td></td></tr>` +
    `<tr><td class="k">max corner</td><td class="v">${d.extra.corner.toFixed(0)}°</td><td></td></tr>`;
  draw();
}

      lo.textContent = FIELD.abs_lo.toFixed(2); hi.textContent = FIELD.abs_hi.toFixed(2);
      note.innerHTML = "L<sub>∇B</sub>/a on the boundary. <b>Smaller = coils must come closer.</b> " +
        "Kappel PPCF 66 (2024) 025018: R²=0.944 for min(L<sub>∇B</sub>)/a vs min coil–surface distance.";
    } else {
      const span = Math.max(Math.abs(FIELD.ratio_lo - 1), Math.abs(FIELD.ratio_hi - 1), 1e-9);
      const st = []; for (let k = 0; k <= 10; k++) st.push(divCol(-1 + 2 * k / 10) + " " + (10 * k) + "%");
      bar.style.background = "linear-gradient(90deg," + st.join(",") + ")";
      lo.textContent = (1 - span).toFixed(2) + "×"; hi.textContent = (1 + span).toFixed(2) + "×";
      note.innerHTML = "This equilibrium's L<sub>∇B</sub>/a divided by <b>" + FIELD.ref + "</b>'s, at matched " +
        "(θ, ζ). <span style='color:" + NEG + "'>Red = fell (harder)</span>, " +
        "<span style='color:" + POS + "'>blue = rose (easier)</span>, gray = unchanged. " +
        "Matched angles are the natural correspondence but not a point-to-point one — the two " +
        "surfaces are different shapes.";
    }
    draw();
  }
  sel.onchange = refresh; refresh();
})();

let drag = null;
cv.addEventListener("pointerdown", e => { drag = {x: e.clientX, y: e.clientY, s: e.shiftKey}; cv.classList.add("drag"); cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (drag.s) { panx += dx; pany -= dy; } else { yaw += dx * 0.008; pitch += dy * 0.008; }
  drag.x = e.clientX; drag.y = e.clientY; draw();
});
for (const t of ["pointerup", "pointercancel"]) cv.addEventListener(t, () => { drag = null; cv.classList.remove("drag"); });
cv.addEventListener("wheel", e => { e.preventDefault(); zoom *= Math.exp(-e.deltaY * 0.0012); resize(); }, {passive: false});
window.addEventListener("resize", resize);
matchMedia("(prefers-color-scheme:dark)").addEventListener("change", draw);
resize(); panel();
</script></body></html>

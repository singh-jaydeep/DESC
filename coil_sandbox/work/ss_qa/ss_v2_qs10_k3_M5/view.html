    for (const p of d.curv_peaks) {
      const q = proj(d.coils[p.row][p.idx]);
      ctx.beginPath(); ctx.arc(q[0], q[1], 3, 0, 7); ctx.fill();
    }
  }
  if (document.getElementById("cClosest").checked) {
    const A = proj(d.closest.a), B = proj(d.closest.b);
    ctx.strokeStyle = "#e53935"; ctx.lineWidth = 2.5; ctx.setLineDash([5, 3]);
    ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.stroke();
    ctx.setLineDash([]); ctx.fillStyle = "#e53935";
    for (const q of [A, B]) { ctx.beginPath(); ctx.arc(q[0], q[1], 3.5, 0, 7); ctx.fill(); }
  }
  if (document.getElementById("cAxes").checked) {
    const L = extent() * 0.55;
    ctx.font = "11px ui-monospace,monospace";
    for (const [a, b, nm] of [[[0, 0, 0], [L, 0, 0], "x"], [[0, 0, 0], [0, L, 0], "y"], [[0, 0, 0], [0, 0, L], "z"]]) {
      const A = proj(a), B = proj(b);
      ctx.strokeStyle = css("--mut"); ctx.lineWidth = 1; ctx.beginPath();
      ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.stroke();
      ctx.fillStyle = css("--mut"); ctx.fillText(nm, B[0] + 3, B[1] + 3);
    }
  }
  document.getElementById("hud").textContent =
    `${d.n_coils} coils${only ? " (" + d.unique_rows.length + " unique shown)" : ""} · ` +
    `closest pair ${d.closest.i + 1}–${d.closest.j + 1} at ${(d.closest.d * 1000).toFixed(1)} mm (sampled)`;
}

function panel() {
  const d = DATA[cur];
  document.getElementById("subtitle").textContent =
    d.file + (d.length_multiplier !== 1 ? ` · length bound ×${d.length_multiplier}` : "");
  const msgs = [];
  if (d.n_coils !== d.expected) msgs.push(`<b>${d.n_coils} coils, expected ${d.expected}.</b> The coilset was read wrongly, or its nesting is not what is assumed.`);
  if (d.linked.length) msgs.push(`<b>${d.linked.length} linked pair${d.linked.length > 1 ? "s" : ""}:</b> ` +
    d.linked.map(p => p[0] + "–" + p[1]).join(", ") + ". This coilset is void.");
  document.getElementById("warnbox").innerHTML = msgs.length ? `<div id="warn">${msgs.join("<br><br>")}</div>` : "";
  const rows = Object.keys(LBL).map(k => {
    const v = d.quantities[k], mg = d.margins[k];
    const good = LOWER[k] ? mg >= 1 : mg <= 1;
    const shown = (k === "d_cc" || k === "d_pc") ? (v * 1000).toFixed(1) + " mm"
      : k === "convex" ? v.toExponential(2) + " " + UNIT[k] : v.toFixed(3) + " " + UNIT[k];
    const cell = mg === null ? `<td class="v">no bound</td>` : `<td class="v ${good ? "ok" : "bad"}">${mg.toFixed(3)}</td>`;
    return `<tr><td class="k">${LBL[k]}</td><td class="v">${shown}</td>${cell}</tr>`;
  }).join("");
  document.getElementById("stats").innerHTML = rows +
    `<tr><td class="k">linked pairs</td><td class="v"></td><td class="v ${d.linked.length ? "bad" : "ok"}">${d.linked.length}</td></tr>` +
    `<tr><td class="k">⟨|B·n|⟩/⟨|B|⟩ ${d.extra.vacuum ? "(vacuum)" : "(coils + plasma)"}</td><td class="v">${d.extra.bn.toExponential(3)}</td><td></td></tr>` +
    `<tr><td class="k">⟨|B·n|/|B|⟩, max |B·n|</td><td class="v">${d.extra.bn_local.toExponential(3)}, ${d.extra.bn_max_T.toFixed(3)} T</td><td></td></tr>` +
    `<tr><td class="k">max corner</td><td class="v">${d.extra.corner.toFixed(0)}°</td><td></td></tr>`;
  draw();
}

const pick = document.getElementById("picker");
DATA.forEach((d, i) => {
  const b = document.createElement("button");
  b.className = "sel"; b.textContent = d.name; b.setAttribute("aria-pressed", i === 0);
  b.onclick = () => { cur = i; [...pick.children].forEach((c, k) => c.setAttribute("aria-pressed", k === i)); resize(); panel(); };
  pick.appendChild(b);
});
const VIEWS = {"3D": [0.6, 0.5], "top (xy)": [0, Math.PI / 2], "front (xz)": [0, 0], "side (yz)": [Math.PI / 2, 0]};
const vb = document.getElementById("views");
Object.entries(VIEWS).forEach(([nm, [y, p]], i) => {
  const b = document.createElement("button");
  b.className = "sel"; b.textContent = nm; b.setAttribute("aria-pressed", i === 0);
  b.onclick = () => { yaw = y; pitch = p; panx = pany = 0; [...vb.children].forEach((c, k) => c.setAttribute("aria-pressed", k === i)); draw(); };
  vb.appendChild(b);
});
for (const id of ["cPlasma", "cClosest", "cCurv", "cUnique", "cAxes"]) document.getElementById(id).onchange = draw;
if (STREAM) {
  document.getElementById("streamrow").style.display = "";
  document.getElementById("cStream").onchange = draw;
  const n = document.createElement("div");
  n.className = "hint"; n.style.margin = "4px 0 0 18px";
  n.innerHTML = STREAM.curves.length + " contours of Φ at equal increments — they are equal-current, " +
    "so they <b>crowd where |K| is large</b>. Shaded by each curve's own ε₁ (" +
    STREAM.lo.toFixed(4) + " light → " + STREAM.hi.toFixed(4) + " dark).";
  document.getElementById("streamrow").after(n);
}

// ---- surface field selector + colourbar ----
(function () {
  if (!FIELD || !FIELD.abs) return;
  const box = document.getElementById("fieldbox"), sel = document.getElementById("fieldSel");
  box.style.display = "";
  const opts = [["off", "off"], ["abs", "L_gradB / a"]];
  if (FIELD.ratio) opts.push(["ratio", "L_gradB ratio vs " + FIELD.ref]);
  for (const [v, t] of opts) { const o = document.createElement("option"); o.value = v; o.textContent = t; sel.appendChild(o); }
  const bar = document.getElementById("cbar");
  function refresh() {
    fieldMode = sel.value;
    const lo = document.getElementById("cbLo"), hi = document.getElementById("cbHi");
    const note = document.getElementById("fieldnote");
    if (fieldMode === "off") { bar.style.background = "none"; lo.textContent = hi.textContent = ""; note.textContent = ""; }
    else if (fieldMode === "abs") {
      const st = []; for (let k = 0; k <= 10; k++) st.push(seqCol(k / 10) + " " + (10 * k) + "%");
      bar.style.background = "linear-gradient(90deg," + st.join(",") + ")";
      lo.textContent = FIELD.abs_lo.toFixed(2); hi.textContent = FIELD.abs_hi.toFixed(2);
      note.innerHTML = "L<sub>∇B</sub>/a on the boundary. <b>Smaller = coils must come closer.</b> " +
        "Kappel PPCF 66 (2024) 025018: R²=0.944 for min(L<sub>∇B</sub>)/a vs min coil–surface distance.";
    } else {
      const span = Math.max(Math.abs(FIELD.ratio_lo - 1), Math.abs(FIELD.ratio_hi - 1), 1e-9);
      const st = []; for (let k = 0; k <= 10; k++) st.push(divCol(-1 + 2 * k / 10) + " " + (10 * k) + "%");
      bar.style.background = "linear-gradient(90deg," + st.join(",") + ")";
      lo.textContent = (1 - span).toFixed(2) + "×"; hi.textContent = (1 + span).toFixed(2) + "×";
      note.innerHTML = "This equilibrium's L<sub>∇B</sub>/a divided by <b>" + FIELD.ref + "</b>'s, at matched " +
        "(θ, ζ). <span style='color:" + NEG + "'>Red = fell (harder)</span>, " +
        "<span style='color:" + POS + "'>blue = rose (easier)</span>, gray = unchanged. " +
        "Matched angles are the natural correspondence but not a point-to-point one — the two " +
        "surfaces are different shapes.";
    }
    draw();
  }
  sel.onchange = refresh; refresh();
})();

let drag = null;
cv.addEventListener("pointerdown", e => { drag = {x: e.clientX, y: e.clientY, s: e.shiftKey}; cv.classList.add("drag"); cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (drag.s) { panx += dx; pany -= dy; } else { yaw += dx * 0.008; pitch += dy * 0.008; }
  drag.x = e.clientX; drag.y = e.clientY; draw();
});
for (const t of ["pointerup", "pointercancel"]) cv.addEventListener(t, () => { drag = null; cv.classList.remove("drag"); });
cv.addEventListener("wheel", e => { e.preventDefault(); zoom *= Math.exp(-e.deltaY * 0.0012); resize(); }, {passive: false});
window.addEventListener("resize", resize);
matchMedia("(prefers-color-scheme:dark)").addEventListener("change", draw);
resize(); panel();
</script></body></html>
